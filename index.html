
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">
<title>Ttoken Escritório</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #212121;
  --panel: #2b2b2b;
  --border: #3b3b3b;
  --text: #ececec;
  --muted: #a0a0a0;
  --accent: #8b9eff;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

button, input, textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* CABEÇALHO */

header {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.menu-button {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 23px;
}

.logo {
  font-size: 17px;
  font-weight: bold;
  letter-spacing: -0.4px;
}

.logo span {
  color: var(--accent);
}

.profile-button {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #454545;
  color: white;
  border: 1px solid #666;
  font-size: 13px;
}

/* TELA PRINCIPAL */

main {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 25px 22px 110px;
  flex: 1;
}

.welcome {
  text-align: center;
  margin: 70px 0 36px;
}

.welcome h1 {
  font-size: clamp(25px, 5vw, 35px);
  font-weight: 500;
  letter-spacing: -1px;
  margin-bottom: 12px;
}

.welcome p {
  font-size: 14px;
  color: var(--muted);
}

/* PESQUISA */

.search-box {
  background: #303030;
  border: 1px solid #444;
  border-radius: 22px;
  padding: 17px;
  transition: border 0.2s;
}

.search-box:focus-within {
  border-color: #777;
}

textarea {
  width: 100%;
  min-height: 65px;
  max-height: 200px;
  resize: vertical;
  background: transparent;
  color: var(--text);
  border: none;
  outline: none;
  font-size: 16px;
  line-height: 1.5;
}

textarea::placeholder {
  color: #999;
}

.search-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.action-left {
  display: flex;
  gap: 8px;
}

.tool-button {
  background: #3b3b3b;
  border: 1px solid #505050;
  color: #ddd;
  border-radius: 20px;
  padding: 8px 12px;
  font-size: 12px;
}

.send-button {
  background: #e8e8e8;
  color: #202020;
  border: none;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 20px;
  font-weight: bold;
}

/* SUGESTÕES */

.suggestions {
  margin-top: 28px;
}

.suggestions-title {
  color: #a5a5a5;
  font-size: 12px;
  text-align: center;
  margin-bottom: 14px;
}

.suggestion-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.suggestion {
  background: transparent;
  border: 1px solid #444;
  color: #d0d0d0;
  border-radius: 20px;
  padding: 11px 15px;
  font-size: 12px;
  transition: background 0.2s;
}

.suggestion:hover {
  background: #333;
}

/* CONVERSA */

#conversation {
  display: none;
  margin-top: 30px;
}

.chat-message {
  padding: 18px;
  margin-bottom: 18px;
  border-radius: 14px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
}

.user-message {
  background: #303030;
  margin-left: 12%;
}

.ai-message {
  background: transparent;
  color: #ddd;
}

/* MENU LATERAL */

.drawer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 10;
  display: none;
}

.drawer-content {
  width: 270px;
  height: 100%;
  background: #171717;
  padding: 24px 16px;
  border-right: 1px solid #333;
}

.drawer-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px;
  background: transparent;
  border: none;
  color: #ddd;
  font-size: 14px;
  border-radius: 9px;
  margin: 5px 0;
}

.drawer-item:hover {
  background: #303030;
}

/* RESPONSIVIDADE */

@media(max-width: 600px) {
  header {
    padding: 0 16px;
  }

  main {
    padding: 15px 16px 100px;
  }

  .welcome {
    margin: 60px 0 30px;
  }

  .suggestion-list {
    flex-direction: column;
  }

  .suggestion {
    text-align: left;
    width: 100%;
    border-radius: 12px;
    padding: 14px;
  }

  .user-message {
    margin-left: 5%;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="header-left">
    <button class="menu-button" onclick="abrirMenu()">☰</button>
    <div class="logo">Ttoken <span>Escritório</span></div>
  </div>

  <button class="profile-button" onclick="irPerfil()">T</button>
</header>

<main>

  <section class="welcome" id="welcome">
    <h1>O que vamos criar hoje?</h1>
    <p>Pesquise, descubra e transforme suas ideias em realidade.</p>
  </section>

  <section class="search-box">
    <textarea id="prompt" placeholder="Descreva o que você está procurando..." onkeydown="atalhoEnter(event)"></textarea>

    <div class="search-actions">
      <div class="action-left">
        <button class="tool-button" onclick="selecionarArquivo()">+ Arquivos</button>
        <button class="tool-button" onclick="mostrarSkills()">Skills</button>
      </div>

      <button class="send-button" onclick="enviar()" aria-label="Enviar">↑</button>
    </div>

    <input type="file" id="arquivo" accept="image/*,video/*" hidden onchange="arquivoSelecionado(event)">
  </section>

  <section class="suggestions" id="suggestions">
    <div class="suggestions-title">EXPERIMENTE PERGUNTAR</div>

    <div class="suggestion-list">
      <button class="suggestion" onclick="sugerir(this)">Encontre produtos em alta para vender</button>
      <button class="suggestion" onclick="sugerir(this)">Quais produtos estão viralizando?</button>
      <button class="suggestion" onclick="sugerir(this)">Crie um vídeo para meu produto</button>
      <button class="suggestion" onclick="sugerir(this)">Analise tendências de mercado</button>
    </div>
  </section>

  <section id="conversation"></section>

</main>
</div>

<!-- MENU -->

<div class="drawer" id="drawer" onclick="fecharMenu(event)">
  <div class="drawer-content">
    <div class="logo" style="padding:10px 14px 25px">Ttoken <span>Escritório</span></div>

    <button class="drawer-item" onclick="novaConversa()">＋ Nova pesquisa</button>
    <button class="drawer-item" onclick="irEstudio()">Estúdio</button>
    <button class="drawer-item" onclick="irPerfil()">Perfil</button>

    <div style="margin-top:35px;padding:12px;color:#777;font-size:11px">
      SEU ASSISTENTE INTELIGENTE
    </div>
  </div>
</div>

<script>
function enviar() {
  const campo = document.getElementById("prompt");
  const texto = campo.value.trim();

  if (!texto) return;

  const conversa = document.getElementById("conversation");

  document.getElementById("welcome").style.display = "none";
  document.getElementById("suggestions").style.display = "none";
  conversa.style.display = "block";

  const pergunta = document.createElement("div");
  pergunta.className = "chat-message user-message";
  pergunta.textContent = texto;
  conversa.appendChild(pergunta);

  const resposta = document.createElement("div");
  resposta.className = "chat-message ai-message";
  resposta.textContent =
    "Sua pesquisa foi registrada. O próximo passo será conectar o Maestro a uma inteligência artificial para analisar seu pedido e gerar respostas reais.";
  conversa.appendChild(resposta);

  campo.value = "";
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function sugerir(botao) {
  document.getElementById("prompt").value = botao.textContent;
  document.getElementById("prompt").focus();
}

function atalhoEnter(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    enviar();
  }
}

function abrirMenu() {
  document.getElementById("drawer").style.display = "block";
}

function fecharMenu(event) {
  if (event.target.id === "drawer") {
    document.getElementById("drawer").style.display = "none";
  }
}

function novaConversa() {
  document.getElementById("conversation").innerHTML = "";
  document.getElementById("conversation").style.display = "none";
  document.getElementById("welcome").style.display = "block";
  document.getElementById("suggestions").style.display = "block";
  document.getElementById("drawer").style.display = "none";
  document.getElementById("prompt").value = "";
}

function mostrarSkills() {
  alert("Skills do Maestro serão configuradas na próxima etapa.");
}

function selecionarArquivo() {
  document.getElementById("arquivo").click();
}

function arquivoSelecionado(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;

  document.getElementById("prompt").value +=
    "\n[Arquivo selecionado: " + arquivo.name + "]";
}

function irEstudio() {
  alert("O Estúdio será desenvolvido na próxima etapa.");
  document.getElementById("drawer").style.display = "none";
}

function irPerfil() {
  alert("O Perfil será desenvolvido na próxima etapa.");
  document.getElementById("drawer").style.display = "none";
}
</script>

</body>
</html>
